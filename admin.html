<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin - PrimePickHub</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-layout">
        <div class="admin-sidebar">
            <h2>PrimePick Admin</h2>
            <div class="admin-nav">
                <a href="#" class="active">Dashboard</a>
                <a href="index.html" target="_blank">View Website ↗</a>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </div>
        <div class="admin-content">
            
            <div id="loginContainer" class="admin-card" style="max-width:420px;margin:80px auto;">
                <h2>Admin Login</h2>
                <br>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <p id="loginError" style="color:#DC2626;font-size:0.85rem;margin-bottom:10px;"></p>
                    <button type="submit" class="btn-check-price" style="width:100%;padding:12px;">Login</button>
                </form>
            </div>

            <div id="dashboard" style="display:none;">
                <h1>Platform Overview</h1>
                <br>
                <div class="stats-grid">
                    <div class="stat-card">
                        <p style="color:#64748B;">Total Products</p>
                        <h3 id="statProducts">0</h3>
                    </div>
                    <div class="stat-card">
                        <p style="color:#64748B;">Affiliate Clicks</p>
                        <h3 id="statClicks">0</h3>
                    </div>
                </div>

                <div class="admin-card">
                    <h2>Add Product</h2>
                    <br>
                    <form id="productForm">
                        <div class="form-group"><label>Product Title</label><input type="text" id="pTitle" required></div>
                        <div class="form-group"><label>URL Slug</label><input type="text" id="pSlug" required pattern="[a-z0-9-]+"></div>
                        
                        <div class="form-group">
                            <label>Primary Image URL</label>
                            <input type="url" id="pImg" required placeholder="https://...main-image.jpg">
                        </div>

                        <div class="form-group">
                            <label>Gallery Images (Har Line Mein Ek URL)</label>
                            <textarea id="pGallery" rows="3" placeholder="https://...image2.jpg&#10;https://...image3.jpg"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Video URL (YouTube - Optional)</label>
                            <input type="url" id="pVideo" placeholder="https://www.youtube.com/watch?v=...">
                        </div>

                        <div class="form-group"><label>Category</label>
                            <select id="pCategory">
                                <option value="electronics">Electronics</option>
                                <option value="fashion">Fashion</option>
                                <option value="home-kitchen">Home & Kitchen</option>
                                <option value="beauty">Beauty</option>
                                <option value="sports">Sports</option>
                            </select>
                        </div>
                        
                        <div class="form-group"><label>Badge (Optional)</label><input type="text" id="pBadge" placeholder="Best Seller"></div>
                        <div class="form-group"><label>Rating (1-5)</label><input type="number" step="0.1" min="1" max="5" id="pRating"></div>
                        <div class="form-group"><label>Reviews Count</label><input type="number" id="pReviewsCount"></div>

                        <h3 style="margin-top:20px; border-bottom:1px solid #ccc; padding-bottom:5px;">Offer Details</h3>
                        <div class="form-group"><label>Store Name</label><input type="text" id="pStore" required placeholder="aliexpress, amazon, daraz"></div>
                        
                        <div style="display: flex; gap: 10px;">
                            <div class="form-group" style="flex: 2;">
                                <label>Price (Number Only)</label>
                                <input type="number" step="0.01" id="pPrice" required placeholder="0.99">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label>Base Currency</label>
                                <select id="pCurrency">
                                    <option value="USD">USD ($)</option>
                                    <option value="PKR">PKR (Rs)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="GBP">GBP (£)</option>
                                    <option value="INR">INR (₹)</option>
                                    <option value="AED">AED (د.إ)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group"><label>Affiliate URL</label><input type="url" id="pAffUrl" required></div>

                        <h3 style="margin-top:20px; border-bottom:1px solid #ccc; padding-bottom:5px;">SEO Content</h3>
                        <div class="form-group"><label>Short Description</label><input type="text" id="pDesc" required></div>
                        <div class="form-group">
                            <label>Detailed Review (HTML allowed)</label>
                            <textarea id="pReview" rows="6" required placeholder="<h3>Our Verdict</h3><p>This is a great product...</p>"></textarea>
                        </div>

                        <div class="form-group">
                            <label><input type="checkbox" id="pFeatured"> Featured</label>
                            <label style="margin-left:20px;"><input type="checkbox" id="pTrending"> Trending</label>
                        </div>
                        <button type="submit" class="btn-check-price" style="width:auto;padding:10px 25px;">Save Product</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
