<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - PrimePickHub</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png?v=4">
    <link rel="stylesheet" href="css/main.css?v=18">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div class="nav-main">
            <a href="/index.html" class="logo">PrimePick<span>Hub</span></a>
            <div style="display:flex; gap:15px;">
                <a href="/index.html" style="text-decoration:none; font-weight:600; color:var(--primary);">Home</a>
                <a href="/blog.html" style="text-decoration:none; font-weight:600; color:var(--accent);">Blog</a>
            </div>
        </div>
    </header>

    <main class="container" style="min-height: 70vh;">
        <h1 style="margin-bottom: 30px; font-family: 'Poppins', sans-serif;">Latest Articles & Buying Guides</h1>
        <div class="product-grid" id="blogGrid"></div>
    </main>

    <div class="newsletter-wrapper">
        <div class="newsletter-box">
            <h2>Get the Best Deals in Your Inbox!</h2>
            <p>Subscribe to PrimePickHub and never miss out on exclusive sales, flash deals, and top-rated products.</p>
            <form id="newsletterForm" class="newsletter-form">
                <input type="email" id="newsletterEmail" placeholder="Enter your email address..." required>
                <button type="submit" id="newsletterBtn">Subscribe</button>
            </form>
            <p id="newsletterMsg" style="margin-top: 10px; font-weight: 600; font-size: 0.9rem;"></p>
        </div>
    </div>

    <script src="js/config.js?v=6"></script>
    <script src="js/blog.js?v=2"></script>
    <script>
        document.getElementById('newsletterForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('newsletterEmail');
            const btn = document.getElementById('newsletterBtn');
            const msg = document.getElementById('newsletterMsg');
            const email = emailInput.value.trim();

            if(!email) return;
            btn.innerText = "Subscribing...";
            btn.disabled = true;
            msg.innerText = "";

            try {
                const { error } = await window.supabaseClient.from('newsletter_subscribers').insert([{ email: email }]);
                if (error) {
                    if (error.code === '23505') { msg.style.color = "#FBBF24"; msg.innerText = "You are already subscribed!"; } 
                    else { throw error; }
                } else {
                    msg.style.color = "#4ADE80"; msg.innerText = "Successfully subscribed! Check your inbox for deals."; emailInput.value = "";
                }
            } catch (err) {
                console.error(err); msg.style.color = "#F87171"; msg.innerText = "Something went wrong. Please try again.";
            } finally {
                btn.innerText = "Subscribe"; btn.disabled = false;
            }
        });
    </script>
    <script src="js/floating-widgets.js?v=2"></script>
</body>
</html>
