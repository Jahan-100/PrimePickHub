<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - PrimePickHub</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png?v=4">
    <link rel="stylesheet" href="css/main.css?v=15">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div class="nav-main">
            <a href="/index.html" class="logo">PrimePick<span>Hub</span></a>
            <div style="display:flex; gap:15px;">
                <a href="/index.html" style="text-decoration:none; font-weight:600; color:var(--primary);">Home</a>
                <a href="/blog.html" style="text-decoration:none; font-weight:600; color:var(--accent);">Blog</a>
            </div>
        </div>
    </header>

    <main class="container" style="max-width: 800px; min-height: 80vh; background: #fff; padding: 40px; border-radius: 12px; border: 1px solid #E2E8F0; margin-top: 30px;">
        <p style="margin-bottom:20px;"><a href="/blog.html" style="color:var(--accent); text-decoration:none;">&larr; Back to Blog</a></p>
        <h1 id="artTitle" style="font-family: 'Poppins', sans-serif; font-size: 2.5rem; margin-bottom: 15px; color: var(--primary);"></h1>
        <p id="artDate" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px;"></p>
        <img id="artImg" src="" alt="Cover" style="width: 100%; border-radius: 12px; margin-bottom: 30px; display: none; object-fit: cover; max-height: 400px;">
        
        <div id="artContent" style="line-height: 1.8; color: #334155; font-size: 1.1rem;"></div>
    </main>

    <script src="js/config.js?v=6"></script>
    <script src="js/blog.js?v=1"></script>
</body>
</html>
